version: '3.8'  
services:  
  backend:  
    build: .  
    ports:  
      - "5000:5000"  
    volumes:  
      - ./src:/app/src  
    environment:  
      - NODE_ENV=development  
      - MONGO_URI=mongodb://mongo:27017/smartcampus  
      - REDIS_URL=redis://redis:6379  
    depends_on:  
      - mongo  
      - redis  
  mongo:  
    image: mongo:6  
    ports:  
      - "27017:27017"  
    volumes:  
      - mongo_data:/data/db  
  redis:  
    image: redis:7-alpine  
    ports:  
      - "6379:6379"  
volumes:  
  mongo_data:
