version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - REDIS_URL2=${REDIS_URL2}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
    restart: always

  # Optional local redis for dev/test environments
  redis-local:
    image: redis:alpine
    ports:
      - "6380:6379"
