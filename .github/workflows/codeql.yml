name: "CodeQL Advanced"

on:
  push:
    branches: [ "clean-rebuild" ]
  pull_request:
    branches: [ "clean-rebuild" ]
  schedule:
    - cron: '24 6 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build for Java/Kotlin (Flutter Android)
      - if: matrix.language == 'java-kotlin'
        name: Build Android for Java/Kotlin CodeQL
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1
          export PATH="$PWD/flutter/bin:$PATH"
          flutter doctor
          flutter pub get
          flutter build apk --debug

      # Manual build for C/C++ (placeholder)
      - if: matrix.language == 'c-cpp'
        name: Build C/C++ project (if any)
        run: |
          echo "No explicit build required for c-cpp in this Flutter project"
          mkdir -p build && cd build
          cmake .. || true
          make || true

      # Manual build for Swift (placeholder)
      - if: matrix.language == 'swift'
        name: Build Swift project (if any)
        run: |
          echo "No Swift code in Flutter project, skipping actual build"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
