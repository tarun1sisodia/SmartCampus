name: Flutter CI

on:
  push:
    branches: [ clean-rebuild ]
  pull_request:
    branches: [ clean-rebuild ]

jobs:
  build:
    name: Build Linux & Android
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Source
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Cache Dependencies
      - name: Cache Flutter Pub
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle.properties') }}

      # 3. Environment Setup
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      # 4. Install Dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. Static Analysis and Tests
      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Check Dart Format
        run: dart format --set-exit-if-changed . || true

      # 6. Android Signing Setup
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/smartcampus.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=smartcampus.jks
          EOF

      # 7. Build Commands
      - name: Build APK (Android)
        run: flutter build apk --release

      - name: Build App Bundle (Android)
        run: flutter build appbundle --release
      # 7. Build Commands

      # Install Linux build dependencies
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libgtk-3-dev \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          liblzma-dev

      - name: Build Linux Desktop
        run: flutter build linux --release

      # 8. Verify Output
      - name: Check built artifacts
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab
          ls -lh build/linux/x64/release/bundle/ || true

      # 9. Upload Artifacts
      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/linux/x64/release/bundle/**

      # 10. GitHub Release (Updated)
      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          v=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2 | tr -d '\r')
          echo "VERSION=$v" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: "Release v${{ env.VERSION }}"
          draft: false
          prerelease: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
